name: CI

# Every push to main and every pull request: run the tests and build Cooldown.exe.
# A version tag (v2.1.1): the same, then publish a GitHub release with that exe, using the
# version's section of CHANGELOG.md as the notes. Don't create the release by hand as well.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Before the slow steps: a tag whose version or changelog isn't ready fails here.
      - name: Check the release is ready
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/Cooldown.Tests -c Release

      # The same command as build.bat.
      - name: Build Cooldown.exe
        run: >
          dotnet publish src/Cooldown -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: Cooldown
          path: publish/Cooldown.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Cooldown

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" Cooldown.exe --verify-tag \
            --title "Cooldown ${GITHUB_REF_NAME#v}" --notes-file notes.md
